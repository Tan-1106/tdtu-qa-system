server {
  listen 80;
  server_name _;

  # Serve static assets
  root /usr/share/nginx/html;
  index index.html;

  # Gzip for better performance
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
  gzip_proxied any;
  gzip_comp_level 5;

  # Cache static assets aggressively (adjust as needed)
  location ~* \.(?:css|js|ico|gif|jpe?g|png|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # SPA fallback: let React Router handle routing
  location / {
    try_files $uri /index.html;
  }

  # Proxy API calls to backend service (same Docker network)
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
