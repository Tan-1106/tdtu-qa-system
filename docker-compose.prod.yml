services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: tdtu_qa_backend_prod
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - uploads:/app/uploads
      - hf_cache:/root/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_BASE=/api
    container_name: tdtu_qa_frontend_prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: tdtu_qa_mongodb_prod
    ports:
      - "27020:27017"
    command: mongod --bind_ip_all --noauth
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: tdtu_qa_chromadb_prod
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/.chroma
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  chroma_data:
  uploads:
  hf_cache:
