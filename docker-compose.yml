services:
  backend:
    build: ./backend
    container_name: tdtu_qa_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      chromadb:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    tty: true
    stdin_open: true

  mongodb:
    image: mongo:6.0
    container_name: tdtu_qa_mongodb
    ports:
      - "27018:27017"
    command: mongod --bind_ip_all --noauth
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: tdtu_qa_chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  chroma_data:
